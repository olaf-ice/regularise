services:
  - type: web
    name: regularise-riderid
    env: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: node server/migrate_db_encryption.js && node server/server.js
    domains:
      - myvault.com.ng
    disk:
      name: rider-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: GOOGLE_SCRIPT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: BASE_URL
        value: https://myvault.com.ng
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
