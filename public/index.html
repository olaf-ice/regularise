<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyVault | Secure Medical & Identity Vault</title>
    <meta name="description" content="Ensure your voice is heard in critical situations. MyVault securely delivers your vital medical and identity information directly to emergency personnel.">
    <meta name="keywords" content="digital identity, emergency vault, medical ID, secure identification, MyVault, health data, emergency contacts">
    
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/style.css">
    
    <!-- Prevent Copy & Right Click -->
    <style>
        body {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        
        .timer-wrapper {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        
        .time-box {
            background: var(--surface);
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 1.5rem 1rem;
            width: 90px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        
        .time-value {
            font-size: 2.5rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1;
            margin-bottom: 0.5rem;
        }
        
        .time-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 1px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.9rem;
            cursor: pointer;
            text-align: left;
        }
        
        .checkbox-group input {
            accent-color: var(--primary);
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
    </style>
    <script>
        document.addEventListener('copy', event => event.preventDefault());
    </script>
</head>
<body>

    <div class="landing-container" style="max-width: 800px; text-align: center; margin-top: 2rem;">
        <div class="badge badge-secure" style="margin-bottom: 2rem;">
            <!-- Waitlist/Launch tag removed -->
        </div>
        
        <h1 style="background: none; -webkit-text-fill-color: var(--text); font-size: 3rem; margin-bottom: 1.5rem; line-height: 1.2;">
            When Emergencies Happen, <span style="color: var(--primary);">You’re Not Unknown</span>
        </h1>
        <p style="font-size: 1.25rem; margin-bottom: 3rem; max-width: 600px; margin-left: auto; margin-right: auto;">
            MyVault securely stores your personal, emergency, and identity information with clinical-grade encryption.
        </p>        <div style="margin-top: 2.5rem; display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap;">
            <a href="register.html" class="btn btn-primary" style="font-size: 1.1rem; padding: 1rem 2.5rem; text-decoration: none;">Register Now</a>
            <a href="login.html" class="btn" style="background: var(--surface); border: 1px solid var(--glass-border); color: var(--text); font-size: 1.1rem; padding: 1rem 2.5rem; text-decoration: none; border-radius: 8px; font-weight: 700;">Log In</a>
        </div>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/global.js"></script>
</body>
</html>
