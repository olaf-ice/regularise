<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - MyVault</title>
    
    <!-- Primary Meta Tags -->
    <meta name="title" content="Admin Portal | MyVault Emergency Ecosystem">
    <meta name="description" content="Authorized Personnel & Statutory Command Console.">

    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link href="/css/fonts.css" rel="stylesheet">
    <link rel="stylesheet" href="css/theme.css">
    <script src="js/theme.js"></script>

    <!-- Prevent Copy & Text Selection on Secure Portal -->
    <style>
        body {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--background, #0f172a);
        }

        .admin-login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
            margin: auto;
        }

        .admin-card {
            background: var(--surface, #1e293b);
            border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
            border-radius: 1.25rem;
            padding: 2.25rem 2rem;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.4);
            position: relative;
            overflow: hidden;
        }

        .admin-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #10b981, #0d9488, #3b82f6);
        }

        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.3rem 0.75rem;
            border-radius: 9999px;
            background: rgba(16, 185, 129, 0.12);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 0.75rem;
        }

        .brand-badge .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 8px #10b981;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-wrapper label {
            font-size: 0.82rem;
            color: var(--text-muted, #94a3b8);
            font-weight: 600;
            letter-spacing: 0.02em;
        }

        .input-field-container {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-field {
            width: 100%;
            padding: 0.85rem 1rem;
            padding-right: 2.75rem;
            border-radius: 0.65rem;
            border: 1px solid var(--glass-border, rgba(255, 255, 255, 0.1));
            background: rgba(0, 0, 0, 0.25);
            color: var(--text, #f8fafc);
            font-size: 0.95rem;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        .input-field:focus {
            outline: none;
            border-color: #10b981;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
        }

        .toggle-password-btn {
            position: absolute;
            right: 0.75rem;
            background: none;
            border: none;
            color: var(--text-muted, #94a3b8);
            cursor: pointer;
            padding: 0.25rem;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .toggle-password-btn:hover {
            color: var(--text, #fff);
        }

        .alert-banner {
            padding: 0.75rem 1rem;
            border-radius: 0.65rem;
            font-size: 0.82rem;
            line-height: 1.45;
            text-align: center;
            margin-bottom: 1.25rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .alert-error {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid #ef4444;
            color: #fca5a5;
        }

        .alert-info {
            background: rgba(59, 130, 246, 0.15);
            border: 1px solid #3b82f6;
            color: #93c5fd;
        }

        .login-submit-btn {
            width: 100%;
            padding: 0.9rem;
            border-radius: 0.65rem;
            background: #10b981;
            border: none;
            color: white;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.25rem;
            box-shadow: 0 4px 14px rgba(16, 185, 129, 0.25);
        }

        .login-submit-btn:hover:not(:disabled) {
            background: #059669;
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
        }

        .login-submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none !important;
        }

        .portal-links {
            margin-top: 2rem;
            padding-top: 1.25rem;
            border-top: 1px solid var(--glass-border, rgba(255, 255, 255, 0.08));
            display: flex;
            justify-content: space-between;
            font-size: 0.82rem;
        }

        .portal-links a {
            color: var(--text-muted, #94a3b8);
            text-decoration: none;
            transition: color 0.2s;
        }

        .portal-links a:hover {
            color: #10b981;
            text-decoration: underline;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="admin-login-wrapper">
        <div class="admin-card">
            
            <div style="text-align: center; margin-bottom: 1.5rem;">
                <img src="assets/logo.png" alt="MyVault Logo" style="height: 3.5rem; width: auto; object-fit: contain; margin-bottom: 0.75rem;">
                <br>
                <div class="brand-badge">
                    <span class="dot"></span>
                    <span>Statutory Command</span>
                </div>
                <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.35rem; color: var(--text, #f8fafc);">Admin Portal</h1>
                <p style="color: var(--text-muted, #94a3b8); font-size: 0.85rem; margin: 0;">Authorized Personnel & System Operations</p>
            </div>

            <!-- Dynamic Alert Notices -->
            <div id="alertBox" class="alert-banner"></div>

            <form id="adminForm" onsubmit="handleAdminLogin(event)">
                <div style="display: flex; flex-direction: column; gap: 1.1rem;">
                    
                    <div class="input-wrapper">
                        <label for="adminUsername">Administrator Username</label>
                        <div class="input-field-container">
                            <input 
                                type="text" 
                                id="adminUsername" 
                                class="input-field" 
                                placeholder="Enter admin username" 
                                autocomplete="username" 
                                required
                                autofocus
                            >
                        </div>
                    </div>

                    <div class="input-wrapper">
                        <label for="adminPassword">Security Key / Password</label>
                        <div class="input-field-container">
                            <input 
                                type="password" 
                                id="adminPassword" 
                                class="input-field" 
                                placeholder="••••••••••••" 
                                autocomplete="current-password" 
                                required
                            >
                            <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()" aria-label="Toggle Password Visibility">
                                👁️
                            </button>
                        </div>
                    </div>

                </div>

                <button type="submit" id="submitBtn" class="login-submit-btn">
                    <span>Access Command Console</span>
                    <span aria-hidden="true">&rarr;</span>
                </button>
            </form>

            <div class="portal-links">
                <a href="/login.html">&larr; Public Safety Portal</a>
                <a href="/agent-login.html">Agent Portal &rarr;</a>
            </div>

        </div>

        <p style="text-align: center; font-size: 0.78rem; color: var(--text-muted, #64748b); margin-top: 1.5rem;">
            &copy; 2026 MyVault Verification Ecosystem. Restricted Area.
        </p>
    </div>

    <script>
        document.addEventListener('copy', event => event.preventDefault());

        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const usernameInput = document.getElementById('adminUsername');
        const passwordInput = document.getElementById('adminPassword');

        // Check for redirect queries
        const params = new URLSearchParams(window.location.search);
        const authStatus = params.get('auth');
        if (authStatus === 'required') {
            showAlert('Session authentication required. Please sign in to access the Admin Console.', 'info');
        } else if (authStatus === 'invalid' || authStatus === 'expired') {
            showAlert('Your administrator session has expired or is invalid. Please sign in again.', 'error');
        }

        // Auto-check if existing valid session exists
        const existingToken = localStorage.getItem('adminToken');
        if (existingToken) {
            fetch('/api/admin/notifications', {
                headers: { 'Authorization': `Bearer ${existingToken}` }
            }).then(res => {
                if (res.ok) {
                    window.location.replace('/admin');
                } else {
                    localStorage.removeItem('adminToken');
                }
            }).catch(() => {});
        }

        function showAlert(message, type = 'error') {
            alertBox.textContent = message;
            alertBox.className = `alert-banner ${type === 'info' ? 'alert-info' : 'alert-error'}`;
            alertBox.style.display = 'block';
        }

        function hideAlert() {
            alertBox.style.display = 'none';
            alertBox.textContent = '';
        }

        function togglePasswordVisibility() {
            const isPassword = passwordInput.type === 'password';
            passwordInput.type = isPassword ? 'text' : 'password';
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            hideAlert();

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            if (!username || !password) {
                showAlert('Both username and password are required.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span>Verifying Credentials...</span>';

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await res.json();

                if (data.success && data.token) {
                    localStorage.setItem('adminToken', data.token);
                    submitBtn.innerHTML = '<span>Access Granted. Redirecting...</span>';
                    window.location.href = '/admin';
                } else {
                    showAlert(data.message || 'Invalid administrator username or password.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<span>Access Command Console</span> <span aria-hidden="true">&rarr;</span>';
                }
            } catch (err) {
                console.error('Admin Login Error:', err);
                showAlert('Connection error. Please verify the server is running and try again.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<span>Access Command Console</span> <span aria-hidden="true">&rarr;</span>';
            }
        }
    </script>
</body>
</html>
