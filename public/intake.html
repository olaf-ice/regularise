<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Intake | MyVault</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="js/theme.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--bg);
            margin: 0;
        }
        .intake-header {
            text-align: center;
            padding: 2rem 1rem 1rem;
        }
        .intake-header img {
            height: 3rem;
            width: auto;
            object-fit: contain;
            margin-bottom: 0.5rem;
        }
        .intake-header h1 {
            color: var(--primary-light);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .intake-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            max-width: 500px;
            margin: 0 auto;
        }
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }
        iframe {
            width: 100%;
            height: 800px; /* Default height */
            border: none;
            border-radius: 12px;
            background: white; /* Google Forms usually have white backgrounds */
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="intake-header">
        <a href="/" style="text-decoration: none;">
            <img src="assets/logo.png" alt="MyVault Logo">
        </a>
        <h1>Rider Registration Intake</h1>
        <p>Please fill out the form below securely. Your information will be encrypted and added to the MyVault emergency registry.</p>
    </div>

    <div class="iframe-container">
        <!-- PASTE YOUR GOOGLE FORM EMBED LINK BELOW THIS LINE -->
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdLy1n1Paa9wsRKXv43jUTaP4L2p5ZYKmf8vkZ8h5vvfZ4y-g/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    </div>
</body>
</html>
