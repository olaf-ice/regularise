<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Intake | MyVault</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/theme.css">
    <link href="/css/fonts.css" rel="stylesheet">
    <script src="js/theme.js"></script>
    <script src="js/html2canvas.min.js"></script>
    <script src="js/jspdf.umd.min.js"></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: var(--bg);
            margin: 0;
        }
        .intake-header {
            text-align: center;
            padding: 2rem 1rem 1rem;
        }
        .intake-header img {
            height: 3rem;
            width: auto;
            object-fit: contain;
            margin-bottom: 0.5rem;
        }
        .intake-header h1 {
            color: var(--primary-light);
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .intake-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
            max-width: 500px;
            margin: 0 auto;
        }
        .btn-download-pdf {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark, #0d9488));
            color: white;
            padding: 0.65rem 1.4rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(13, 148, 136, 0.3);
            transition: all 0.2s ease;
            text-decoration: none;
            margin-top: 1rem;
        }
        .btn-download-pdf:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(13, 148, 136, 0.45);
        }
        .iframe-container {
            flex-grow: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            padding: 1rem;
            display: flex;
            flex-direction: column;
        }
        iframe {
            width: 100%;
            height: 800px; /* Default height */
            border: none;
            border-radius: 12px;
            background: white; /* Google Forms usually have white backgrounds */
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="intake-header">
        <a href="/" style="text-decoration: none;">
            <img src="assets/logo.png" alt="MyVault Logo">
        </a>
        <h1>User Registration Intake</h1>
        <p>Please fill out the form below securely. Your information will be encrypted and added to the MyVault emergency registry.</p>
        
        <div>
            <button onclick="downloadIntakeFormPDF(event)" class="btn-download-pdf" id="downloadPdfBtn">
                📥 Download Registration Form (PDF)
            </button>
        </div>
    </div>

    <div class="iframe-container">
        <!-- PASTE YOUR GOOGLE FORM EMBED LINK BELOW THIS LINE -->
        <iframe src="https://docs.google.com/forms/d/e/1FAIpQLSdLy1n1Paa9wsRKXv43jUTaP4L2p5ZYKmf8vkZ8h5vvfZ4y-g/viewform?embedded=true" frameborder="0" marginheight="0" marginwidth="0">Loading…</iframe>
    </div>

    <footer style="margin-top: 2rem; padding: 2rem 0; text-align: center; font-size: 0.875rem; color: var(--text-muted);">
        &copy; 2026 MyVault Verification Ecosystem. All rights reserved.
    </footer>

    <script>
        async function downloadIntakeFormPDF(event) {
            let btn = event ? event.currentTarget : document.getElementById('downloadPdfBtn');
            let origText = btn ? btn.innerHTML : '';
            if (btn) {
                btn.innerHTML = '⏳ Generating PDF...';
                btn.disabled = true;
            }

            if (!window.html2canvas || !window.jspdf) {
                alert('PDF generator libraries are still loading. Please try again in a moment.');
                if (btn) { btn.innerHTML = origText; btn.disabled = false; }
                return;
            }

            try {
                const container = document.createElement('div');
                container.style.position = 'fixed';
                container.style.left = '-9999px';
                container.style.top = '0';
                container.style.width = '794px';
                container.style.background = '#ffffff';
                container.style.color = '#0f172a';
                container.style.fontFamily = "'Inter', Arial, sans-serif";
                container.style.padding = '36px 42px';
                container.style.boxSizing = 'border-box';
                container.style.zIndex = '-9999';

                container.innerHTML = `
                <div style="font-family: Arial, sans-serif; color: #0f172a; line-height: 1.35; font-size: 11px;">
                    <!-- Official Header -->
                    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2.5px solid #0f766e; padding-bottom: 12px; margin-bottom: 14px;">
                        <div>
                            <div style="font-size: 20px; font-weight: 800; color: #0f766e; letter-spacing: 0.04em;">MYVAULT VERIFICATION ECOSYSTEM</div>
                            <div style="font-size: 11px; font-weight: 700; color: #334155; margin-top: 2px;">OFFICIAL RIDER / OPERATOR REGISTRATION INTAKE FORM</div>
                            <div style="font-size: 9px; color: #64748b;">Statutory NDPA 2023 Compliant Emergency Database Registry &bull; Federal Republic of Nigeria</div>
                        </div>
                        <div style="text-align: right; border-left: 2px solid #e2e8f0; padding-left: 12px;">
                            <div style="font-size: 9px; font-weight: 700; color: #64748b;">DOCUMENT NO.</div>
                            <div style="font-size: 12px; font-weight: 800; color: #0f172a; letter-spacing: 0.05em;">MV-REG-FORM-2026</div>
                            <div style="font-size: 9px; color: #64748b;">Google Sync: ACTIVE</div>
                        </div>
                    </div>

                    <!-- Form Notice -->
                    <div style="background: #f1f5f9; border: 1px solid #cbd5e1; border-radius: 4px; padding: 6px 10px; margin-bottom: 12px; font-size: 9.5px; color: #334155;">
                        <strong>Instructions:</strong> Please fill out all required fields in BLOCK CAPITALS. This data is ingested into the MyVault emergency surveillance system to ensure your medical and operational identity is securely recoverable during critical roadside incidents.
                    </div>

                    <!-- SECTION 1: PERSONAL PARTICULARS -->
                    <div style="margin-bottom: 12px;">
                        <div style="background: #0f766e; color: #ffffff; padding: 4px 8px; font-weight: 700; font-size: 10px; border-radius: 2px; margin-bottom: 6px;">
                            1. PERSONAL &amp; BIOMETRIC PARTICULARS
                        </div>
                        <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
                            <tr>
                                <td style="width: 50%; padding: 4px 0;"><strong>Full Legal Name:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                                <td style="width: 25%; padding: 4px 6px;"><strong>Gender:</strong> [ &nbsp; ] M &nbsp;&nbsp; [ &nbsp; ] F</td>
                                <td style="width: 25%; padding: 4px 0;"><strong>Date of Birth:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                            </tr>
                            <tr>
                                <td style="padding: 4px 0;"><strong>Primary Phone Number:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                                <td colspan="2" style="padding: 4px 0 4px 6px;"><strong>Alternate Phone Number:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                            </tr>
                            <tr>
                                <td style="padding: 4px 0;"><strong>Email Address:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                                <td colspan="2" style="padding: 4px 0 4px 6px;"><strong>National Identity Number (NIN):</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                            </tr>
                            <tr>
                                <td colspan="2" style="padding: 4px 0;"><strong>Residential Street Address:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                                <td style="padding: 4px 0 4px 6px;"><strong>State / LGA of Residence:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                            </tr>
                        </table>
                    </div>

                    <!-- SECTION 2: OPERATIONAL & VEHICLE DETAILS -->
                    <div style="margin-bottom: 12px;">
                        <div style="background: #0f766e; color: #ffffff; padding: 4px 8px; font-weight: 700; font-size: 10px; border-radius: 2px; margin-bottom: 6px;">
                            2. VEHICLE &amp; OPERATIONAL IDENTIFICATION
                        </div>
                        <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
                            <tr>
                                <td style="width: 33%; padding: 4px 0;"><strong>Vehicle Type:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;">Motorcycle / Tricycle</div></td>
                                <td style="width: 33%; padding: 4px 6px;"><strong>Vehicle Make &amp; Model:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                                <td style="width: 34%; padding: 4px 0;"><strong>Vehicle Color:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                            </tr>
                            <tr>
                                <td style="padding: 4px 0;"><strong>Official Plate Number:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                                <td style="padding: 4px 6px;"><strong>Chassis / Engine Number:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                                <td style="padding: 4px 0;"><strong>Designated Dispatch Hub / Route:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                            </tr>
                        </table>
                    </div>

                    <!-- SECTION 3: CLINICAL & EMERGENCY DIRECTIVE -->
                    <div style="margin-bottom: 12px;">
                        <div style="background: #0f766e; color: #ffffff; padding: 4px 8px; font-weight: 700; font-size: 10px; border-radius: 2px; margin-bottom: 6px;">
                            3. CLINICAL EMERGENCY MEDICAL PROFILE (FIRST RESPONDER DIRECTIVE)
                        </div>
                        <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
                            <tr>
                                <td style="width: 25%; padding: 4px 0;"><strong>Blood Group:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                                <td style="width: 25%; padding: 4px 6px;"><strong>Genotype:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                                <td style="width: 50%; padding: 4px 0;"><strong>Known Allergies / Medical Conditions:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                            </tr>
                            <tr>
                                <td colspan="3" style="padding: 4px 0;"><strong>Preferred Hospital / Medical Facility:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                            </tr>
                        </table>
                    </div>

                    <!-- SECTION 4: NEXT-OF-KIN & GUARANTOR -->
                    <div style="margin-bottom: 12px;">
                        <div style="background: #0f766e; color: #ffffff; padding: 4px 8px; font-weight: 700; font-size: 10px; border-radius: 2px; margin-bottom: 6px;">
                            4. NEXT-OF-KIN &amp; PRIMARY EMERGENCY CONTACT
                        </div>
                        <table style="width: 100%; border-collapse: collapse; font-size: 10px;">
                            <tr>
                                <td style="width: 40%; padding: 4px 0;"><strong>Next-of-Kin Name:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                                <td style="width: 25%; padding: 4px 6px;"><strong>Relationship:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                                <td style="width: 35%; padding: 4px 0;"><strong>Emergency Contact Phone:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                            </tr>
                            <tr>
                                <td colspan="3" style="padding: 4px 0;"><strong>Contact Residential Address:</strong> <div style="border-bottom: 1px solid #94a3b8; height: 18px; margin-top: 2px;"></div></td>
                            </tr>
                        </table>
                    </div>

                    <!-- SECTION 5: STATUTORY NDPA 2023 CONSENT & SIGN-OFF -->
                    <div style="border: 1px solid #cbd5e1; border-radius: 4px; padding: 8px 10px; margin-bottom: 14px; background: #fafafa;">
                        <div style="font-weight: 700; font-size: 9.5px; color: #0f172a; margin-bottom: 4px;">STATUTORY NDPA 2023 PRIVACY &amp; DATA ATTESTATION</div>
                        <p style="font-size: 8.5px; color: #475569; margin: 0 0 8px 0; line-height: 1.35;">
                            I hereby attest that the information provided is accurate and complete. I authorize MyVault Ecosystem to securely encrypt, process, and synchronize my medical and biometric records with authorized emergency dispatchers and licensed clinical personnel solely for identification and life preservation under the Nigeria Data Protection Act (NDPA 2023).
                        </p>
                        <table style="width: 100%; font-size: 9.5px; border-collapse: collapse;">
                            <tr>
                                <td style="width: 45%; vertical-align: bottom;">
                                <div><strong>Applicant Signature:</strong> _______________________</div>
                                <div style="margin-top: 4px;"><strong>Date:</strong> _________________________________</div>
                            </td>
                            <td style="width: 10%; text-align: center; vertical-align: middle;">
                                <div style="border: 1px dashed #94a3b8; width: 60px; height: 60px; margin: 0 auto; display: flex; align-items: center; justify-content: center; font-size: 8px; color: #94a3b8; text-align: center;">
                                    AFFIX<br>PASSPORT
                                </div>
                            </td>
                            <td style="width: 45%; text-align: right; vertical-align: bottom;">
                                <div><strong>Authorized Agent Stamp &amp; Signature:</strong> _______________________</div>
                                <div style="margin-top: 4px;"><strong>Verification Date:</strong> _________________________________</div>
                            </td>
                        </tr>
                    </table>
                </div>

                <!-- Footer & Online Portal QR Indicator -->
                <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #cbd5e1; padding-top: 8px; font-size: 8.5px; color: #64748b;">
                    <div>Web Portal: <strong>https://myvault.com.ng/intake.html</strong> &bull; Emergency Hotline: <strong>0800-MYVAULT</strong></div>
                    <div>Form Rev: 2026.1 &bull; Powered by MyVault Secure Systems</div>
                </div>
            </div>
            `;

            document.body.appendChild(container);

            await new Promise(r => setTimeout(r, 200));

            const canvas = await window.html2canvas(container, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff'
            });

            const imgData = canvas.toDataURL('image/png', 1.0);
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
                orientation: 'portrait',
                unit: 'mm',
                format: 'a4'
            });

            const imgWidth = 210;
            const pageHeight = 297;
            const imgHeight = (canvas.height * imgWidth) / canvas.width;

            if (imgHeight <= pageHeight) {
                pdf.addImage(imgData, 'PNG', 0, 0, imgWidth, imgHeight, '', 'FAST');
            } else {
                let heightLeft = imgHeight;
                let position = 0;
                pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight, '', 'FAST');
                heightLeft -= pageHeight;
                while (heightLeft > 0) {
                    position = heightLeft - imgHeight;
                    pdf.addPage();
                    pdf.addImage(imgData, 'PNG', 0, position, imgWidth, imgHeight, '', 'FAST');
                    heightLeft -= pageHeight;
                }
            }

            pdf.save('MyVault_Registration_Intake_Form.pdf');

            document.body.removeChild(container);
        } catch (err) {
            console.error('Intake Form PDF generation error:', err);
            alert('Failed to generate Intake PDF.');
        } finally {
            if (btn) {
                btn.innerHTML = origText;
                btn.disabled = false;
            }
        }
    }

    // Auto-trigger if ?download=1 or ?pdf=1 is in URL
    if (new URLSearchParams(window.location.search).get('download') === '1' || new URLSearchParams(window.location.search).get('pdf') === '1') {
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => { downloadIntakeFormPDF(); }, 500);
        });
    }
    </script>
</body>
</html>
